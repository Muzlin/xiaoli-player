<!doctype html><html lang="zh"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>小李播放器 · 管理台入口</title>
<style>
body{font-family:-apple-system,sans-serif;background:linear-gradient(135deg,#23232b,#3a2a22);
color:#fff;margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center}
.c{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.12);border-radius:16px;
padding:28px 22px;width:86%;max-width:420px;text-align:center}
h1{font-size:20px;margin:0 0 6px}.s{color:#bbb;font-size:13px;margin-bottom:18px}
a.btn{display:inline-block;background:#F26B21;color:#fff;text-decoration:none;padding:12px 20px;
border-radius:10px;font-weight:600;margin:6px 4px}
code{background:rgba(0,0,0,.3);padding:2px 6px;border-radius:6px;font-size:12px;word-break:break-all}
#st{color:#9af;font-size:13px;margin-top:14px}
</style></head><body><div class="c">
<h1>小李播放器 · 管理台</h1>
<div class="s">此页永远指向当前服务器地址(隧道换址自动跟随)</div>
<a class="btn" id="go" href="#">进入管理台</a>
<a class="btn" style="background:#3a3a46" href="https://raw.githubusercontent.com/Muzlin/xiaoli-player/flutter-client/public_url.txt" target="_blank">查看当前地址</a>
<div id="st">正在获取当前服务器地址…</div>
</div>
<script>
const API='https://api.github.com/repos/Muzlin/xiaoli-player/contents/public_url.txt?ref=flutter-client';
fetch(API,{headers:{'Accept':'application/vnd.github.raw'}})
 .then(r=>r.text()).then(u=>{
   u=(u||'').trim();
   if(u.startsWith('https://')){
     const url=u+'/console';
     document.getElementById('go').href=url;
     document.getElementById('st').innerHTML='当前地址：<code>'+u+'</code><br>点上面按钮进管理台（需密码）';
     location.replace(url); // 自动跳转
   }else{throw new Error('bad url');}
 })
 .catch(e=>{document.getElementById('st').textContent='获取地址失败，请点「查看当前地址」手动拼接 /console';});
</script></body></html>
